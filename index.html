<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Our Families — A Living Graph</title>
<meta name="description" content="An interactive family tree. Explore generations, find how any two people are connected, and read the stories behind the names.">
<meta name="theme-color" content="#0a0e1a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f1e6" media="(prefers-color-scheme: light)">

<meta property="og:type" content="website">
<meta property="og:title" content="Our Families — A Living Graph">
<meta property="og:description" content="An interactive family tree. Explore generations, find how any two people are connected, and read the stories behind the names.">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌳</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/css/theme.css">
<link rel="stylesheet" href="assets/css/app.css">

<script src="config.js"></script>
<script>
  // Set the theme before first paint so there is no flash of the wrong colours.
  (function () {
    try {
      var saved = localStorage.getItem('ft-theme');
      var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.dataset.theme = theme;
    } catch (e) {}
  })();
</script>
</head>
<body>

<canvas id="particles" aria-hidden="true"></canvas>

<!-- ─────────────────────────── Top bar ─────────────────────────── -->
<header class="topbar">
  <button class="brand" id="brand" title="Back to the overview">
    <span class="mark" id="brandMark">Our Families</span>
    <span class="sub">a living graph</span>
  </button>

  <div class="top-actions">
    <button class="search-trigger" id="searchTrigger" aria-label="Search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>
      </svg>
      <span class="label">Search everything</span>
      <kbd class="hint"><span class="mod">⌘</span>K</kbd>
    </button>

    <div class="icon-row">
      <button class="icon-btn" id="statsBtn" title="Family statistics" aria-label="Family statistics">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>
        </svg>
      </button>
      <button class="icon-btn" id="timelineBtn" title="Time travel (T)" aria-label="Time travel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
        </svg>
      </button>
      <button class="icon-btn" id="themeBtn" title="Switch theme" aria-label="Switch between dark and light">
        <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z"/>
        </svg>
        <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
      <button class="icon-btn" id="adminBtn" title="Add &amp; edit" aria-label="Add and edit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<!-- ─────────────────────────── Overview ─────────────────────────── -->
<main class="galaxy" id="galaxy">
  <div class="galaxy-title">
    <h1 id="galaxyHeadline">One family, many branches</h1>
    <p class="deck" id="galaxyDeck">—</p>
  </div>

  <div class="galaxy-inner" id="galaxyInner" role="list"></div>

  <p class="galaxy-hint">
    <span class="on-pointer">Tap a family to explore</span>
    <span class="on-keyboard">Pick a family, or press <kbd>space</kbd> to see everyone</span>
  </p>

  <div class="galaxy-stats" id="galaxyStats"></div>
</main>

<!-- ─────────────────────────── Tree ─────────────────────────── -->
<section class="tree-view" id="treeView" aria-label="Family graph">
  <button class="tree-back" id="treeBack">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    <span>Overview</span>
  </button>

  <nav class="tree-toolbar" id="treeToolbar">
    <div class="tb-scroll" id="famFilters"></div>
    <div class="sep"></div>
    <button data-action="connect" id="connectBtn" title="Show how two people are related">Find path</button>
    <button data-action="layout" id="layoutToggle" title="Switch layout">By generation</button>
  </nav>

  <div class="banner connect-banner" id="connectBanner" role="status"></div>
  <div class="banner focus-banner" id="focusBanner" role="status">
    <span class="label">Centred on</span>
    <span class="who" id="focusWho">—</span>
    <button id="focusClear">Reset</button>
  </div>

  <div class="canvas-wrap" id="canvasWrap">
    <div class="canvas" id="canvas"></div>
  </div>

  <div class="empty-state" id="emptyState" hidden>
    <p class="es-title">Nothing to show here yet</p>
    <p class="es-sub" id="emptyStateSub"></p>
  </div>

  <div class="minimap" id="minimap" title="Click to jump">
    <canvas id="minimapCanvas" width="400" height="280"></canvas>
    <div class="minimap-viewport" id="minimapViewport"></div>
    <span class="minimap-label">map</span>
  </div>

  <div class="tree-zoom">
    <button id="zoomIn" title="Zoom in (+)" aria-label="Zoom in">+</button>
    <button id="zoomOut" title="Zoom out (−)" aria-label="Zoom out">−</button>
    <button class="fit" id="zoomFit" title="Fit to screen (F)">FIT</button>
  </div>

  <div class="timeline-scrubber" id="timelineScrubber">
    <div class="ts-head">
      <span class="ts-title">Time travel</span>
      <span class="ts-year" id="tsYear">—</span>
    </div>
    <div class="ts-bar">
      <div class="ts-track"></div>
      <div class="ts-fill" id="tsFill"></div>
      <div class="ts-thumb" id="tsThumb"></div>
      <input type="range" class="ts-input" id="tsInput" min="1900" max="2026" value="2026" aria-label="Year">
    </div>
    <div class="ts-events" id="tsEvents"></div>
    <div class="ts-legend" id="tsLegend"></div>
  </div>
</section>

<!-- ─────────────────────────── Drawers ─────────────────────────── -->
<div class="backdrop" id="backdrop"></div>

<aside class="drawer" id="panel" aria-label="Person details">
  <button class="drawer-close" data-close="panel" aria-label="Close">×</button>
  <div id="panelContent"></div>
</aside>

<aside class="drawer" id="statsPanel" aria-label="Family statistics">
  <button class="drawer-close" data-close="statsPanel" aria-label="Close">×</button>
  <div class="drawer-head">
    <h2>Family in numbers</h2>
    <p class="sub">the graph, summarised</p>
  </div>
  <div class="drawer-body" id="statsBody"></div>
</aside>

<aside class="drawer" id="adminPanel" aria-label="Add and edit">
  <button class="drawer-close" data-close="adminPanel" aria-label="Close">×</button>
  <div class="drawer-head">
    <h2 id="adminTitle">Add &amp; edit</h2>
    <p class="sub" id="adminSub">Keep the tree growing</p>
  </div>
  <div class="drawer-body" id="adminBody"></div>
</aside>

<!-- ─────────────────────────── Search palette ─────────────────────────── -->
<div class="palette-backdrop" id="paletteBackdrop"></div>
<div class="palette" id="palette" role="dialog" aria-label="Search" aria-modal="true">
  <div class="palette-input-wrap">
    <svg class="pi-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>
    </svg>
    <input type="text" id="paletteInput" placeholder="Search people, places, years, stories…"
           autocomplete="off" spellcheck="false" aria-label="Search everything">
    <kbd class="pi-esc">esc</kbd>
  </div>
  <div class="palette-results" id="paletteResults"></div>
  <div class="palette-foot">
    <span><kbd>↑</kbd><kbd>↓</kbd> move</span>
    <span><kbd>↵</kbd> open</span>
    <span id="paletteCount"></span>
  </div>
</div>

<!-- ─────────────────────────── Modal (forms) ─────────────────────────── -->
<div class="modal-backdrop" id="modalBackdrop"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true">
  <button class="drawer-close" id="modalClose" aria-label="Close">×</button>
  <div class="modal-head">
    <h2 id="modalTitle">—</h2>
    <p class="sub" id="modalSub"></p>
  </div>
  <div class="modal-body" id="modalBody"></div>
  <div class="modal-foot" id="modalFoot"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="boot-error" id="bootError" hidden></div>

<script type="module" src="assets/js/main.js"></script>
</body>
</html>
